name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Seed and index a fixture vault
        run: |
          cargo run -p xtask -- seed --count 250 --dir artifacts/vault --db artifacts/bench.db
          cargo run -p xtask -- bench --db artifacts/bench.db

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-artifacts-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
